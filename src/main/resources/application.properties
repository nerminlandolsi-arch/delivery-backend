<# ===========================
# APPLICATION
# ===========================
spring.application.name=delivery-backend
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/api
server.port=${PORT:8080}
# ===========================
# MYSQL DATABASE
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/delivery_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# JWT CONFIGURATION
# ===========================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ===========================
# FILE UPLOAD
# ===========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/

# ===========================
# FIREBASE FCM
# ===========================
app.firebase.credentials-file=firebase-service-account.json

# ===========================
# LOGGING
# ===========================
logging.level.com.delivery=DEBUG
logging.level.org.springframework.security=INFO

# ===========================
# SWAGGER UI
# ===========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
>